<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Auth Dashboard</title>
  <meta name="description" content="Manage your S-Auth account, profile, and OAuth applications.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: hsl(262, 83%, 58%);
      --primary-light: hsl(262, 83%, 68%);
      --primary-glow: hsla(262, 83%, 58%, 0.3);
      --bg: #050507;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.15);
      --text: #f0f0f5;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --blue: #3b82f6;
      --radius: 0.75rem;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--primary-light); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .liquid-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(100px); opacity: 0.35;
      animation: drift 25s infinite alternate ease-in-out;
    }
    .blob-1 { width: 600px; height: 600px; background: hsla(262,83%,58%,0.3); top: -150px; left: -150px; }
    .blob-2 { width: 700px; height: 700px; background: hsla(210,100%,50%,0.15); bottom: -250px; right: -200px; animation-delay:-8s; }
    .blob-3 { width: 400px; height: 400px; background: hsla(280,80%,60%,0.1); top: 40%; left: 30%; animation-delay:-15s; animation-duration:30s; }
    @keyframes drift {
      0% { transform: translate(0,0) scale(1); }
      33% { transform: translate(60px,100px) scale(1.1); }
      66% { transform: translate(-40px,60px) scale(0.9); }
      100% { transform: translate(0,0) scale(1); }
    }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(5, 5, 7, 0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1000px; margin: 0 auto; padding: 0.75rem 1.5rem;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 0.6rem;
      text-decoration: none; color: var(--text); font-weight: 700; font-size: 1.1rem;
    }
    .nav-brand img { width: 32px; height: 32px; border-radius: 6px; }
    .nav-links { display: flex; gap: 0.25rem; align-items: center; }
    .nav-links a {
      color: var(--text-muted); text-decoration: none; font-size: 0.875rem;
      padding: 0.5rem 0.9rem; border-radius: 0.5rem; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--surface-hover); }
    .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; padding: 0.25rem; }

    main { padding-top: 5rem; padding-bottom: 3rem; min-height: 100vh; }

    .page { display: none; animation: fadeIn 0.3s ease-out; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card { padding: 2rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    .card p { color: var(--text-muted); font-size: 0.9375rem; margin-bottom: 1.5rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.65rem 1.5rem; border-radius: 0.5rem; font-weight: 600;
      font-size: 0.875rem; cursor: pointer; transition: all 0.25s; border: none;
      text-decoration: none; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 0 20px var(--primary-glow); }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-bright); }
    .btn-ghost:hover { background: var(--surface-hover); border-color: var(--primary); }
    .btn-sm { padding: 0.4rem 1rem; font-size: 0.8125rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.35rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.65rem 0.85rem; border-radius: 0.5rem;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 0.9375rem; font-family: inherit; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-check { display: flex; align-items: center; gap: 0.5rem; }
    .form-check input[type="checkbox"] { width: auto; accent-color: var(--primary); }
    .form-check label { margin: 0; cursor: pointer; }
    .form-error { color: var(--danger); font-size: 0.8125rem; margin-top: 0.25rem; display: none; }
    .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .stat-card { padding: 1.25rem; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.5rem; font-weight: 700; }

    .app-card { padding: 1.25rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .app-info { flex: 1; min-width: 0; }
    .app-info h4 { font-weight: 600; margin-bottom: 0.2rem; }
    .app-info p { font-size: 0.8125rem; color: var(--text-dim); margin: 0; word-break: break-all; }
    .app-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.6rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 500;
    }
    .badge-success { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
    .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .badge-info { background: rgba(59,130,246,0.1); color: var(--blue); border: 1px solid rgba(59,130,246,0.2); }

    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
      padding: 1rem 1.5rem; border-radius: 0.5rem;
      font-size: 0.875rem; font-weight: 500;
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s ease-out;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: var(--success); }
    .toast-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }

    .secret-box {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2);
      border-radius: 0.5rem; padding: 1rem; margin: 1rem 0;
    }
    .secret-box p { color: var(--warning); font-size: 0.8125rem; margin: 0 0 0.5rem; }
    .secret-box code {
      display: block; word-break: break-all; font-size: 0.875rem;
      background: rgba(0,0,0,0.3); padding: 0.5rem 0.75rem; border-radius: 0.35rem;
    }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-dim); }
    .empty-state p { font-size: 0.9375rem; margin-bottom: 1rem; }

    .loading { text-align: center; padding: 3rem; color: var(--text-dim); }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-page { max-width: 420px; margin: 0 auto; padding-top: 3rem; }
    .login-page .card { padding: 2.5rem; }
    .login-page h1 { text-align: center; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .login-page .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9375rem; margin-bottom: 2rem; }

    .delete-warning { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
    .delete-warning strong { color: var(--danger); }
    .delete-warning ul { color: var(--text-muted); font-size: 0.875rem; margin: 0.5rem 0 0 1.25rem; }

    .info-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.9375rem; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-dim); }
    .info-value { color: var(--text); font-weight: 500; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 150;
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 2rem; }
    .modal h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; }

    @media (max-width: 640px) {
      .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: rgba(5,5,7,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0.5rem; }
      .nav-links.show { display: flex; }
      .hamburger { display: block; }
      .form-row { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .app-card { flex-direction: column; align-items: stretch; }
      .app-actions { justify-content: flex-end; }
      .card { padding: 1.25rem; }
    }
  </style>
</head>
<body>

<div class="liquid-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<nav>
  <div class="nav-inner">
    <a href="/dashboard" class="nav-brand">
      <img src="/logo.png" alt="S-Auth">
      <span>S-Auth</span>
    </a>
    <button class="hamburger" onclick="toggleNav()" aria-label="Toggle navigation">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="#dashboard" onclick="navigate('dashboard')">Dashboard</a>
      <a href="#profile" onclick="navigate('profile')">Profile</a>
      <a href="#apps" onclick="navigate('apps')">Apps</a>
      <a href="#security" onclick="navigate('security')">Security</a>
      <a href="#delete" onclick="navigate('delete')" style="color:var(--danger)">Delete</a>
    </div>
  </div>
</nav>

<main class="container" id="mainContent">
  <div class="loading"><div class="spinner"></div></div>
</main>

<div id="toast" class="toast"></div>
<div id="modalOverlay" class="modal-overlay"><div class="modal glass" id="modalContent"></div></div>

<script>
  const API = window.location.origin;
  let state = { user: null, apps: [], token: null };

  function getToken() { return state.token || sessionStorage.getItem('sauth_token'); }
  function setToken(t) { state.token = t; if (t) sessionStorage.setItem('sauth_token', t); else sessionStorage.removeItem('sauth_token'); }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    const token = getToken();
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    if (res.status === 401) { setToken(null); state.user = null; navigate('login'); throw new Error('Session expired'); }
    return res.json();
  }

  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast toast-' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
  document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

  function toggleNav() { document.getElementById('navLinks').classList.toggle('show'); }

  function navigate(view) {
    location.hash = '#' + view;
    document.getElementById('navLinks').classList.remove('show');
    renderView(view);
  }

  function renderView(view) {
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(a => a.classList.remove('active'));
    const activeLink = document.querySelector('.nav-links a[href="#' + view + '"]');
    if (activeLink) activeLink.classList.add('active');

    if (view === 'login') return renderLogin();
    const token = getToken();
    if (!token) return renderLogin();
    switch (view) {
      case 'dashboard': renderDashboard(); break;
      case 'profile': renderProfile(); break;
      case 'apps': renderApps(); break;
      case 'security': renderSecurity(); break;
      case 'delete': renderDelete(); break;
      default: renderDashboard();
    }
  }

  function renderLogin() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="login-page"><div class="card glass"><h1>Sign In</h1><p class="subtitle">Access your S-Auth dashboard</p><form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="you@example.com"></div><div class="form-group"><label>Password</label><input type="password" id="loginPassword" required placeholder="Enter your password"></div><div id="loginError" class="form-error"></div><div class="form-actions"><button type="submit" class="btn btn-primary" style="width:100%">Sign In</button></div></form><p style="text-align:center;margin-top:1.5rem;font-size:0.8125rem;color:var(--text-dim)"><a href="/">← Back to home</a></p></div></div>';
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const btn = document.querySelector('#loginForm button');
    btn.disabled = true; btn.textContent = 'Signing in...';
    errEl.style.display = 'none';
    try {
      const res = await fetch(API + '/api/v1/auth/signin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { throw new Error(data.error || 'Invalid email or password'); }
      setToken(data.access_token);
      state.user = data.user;
      toast('Signed in successfully', 'success');
      navigate('dashboard');
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function renderDashboard() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      const data = await api('GET', '/api/v1/auth/profile');
      state.user = data;
      const u = data;
      main.innerHTML = '<div class="page active"><div class="card glass"><h2>Welcome' + (u.display_name ? ', ' + escapeHtml(u.display_name) : '') + '</h2><p>Your account overview and quick actions.</p></div><div class="stat-grid">' +
        '<div class="stat-card glass"><div class="stat-label">Email</div><div class="stat-value" style="font-size:1rem;font-weight:500">' + escapeHtml(u.email) + '</div></div>' +
        '<div class="stat-card glass"><div class="stat-label">Status</div><div class="stat-value" style="font-size:1rem">' + (u.email_verified ? '<span class="badge badge-success">✅ Verified</span>' : '<span class="badge badge-warning">⏳ Not Verified</span>') + '</div></div>' +
        '<div class="stat-card glass"><div class="stat-label">Role</div><div class="stat-value" style="font-size:1rem;text-transform:capitalize">' + (u.role || 'user') + '</div></div>' +
        '<div class="stat-card glass"><div class="stat-label">Member Since</div><div class="stat-value" style="font-size:1rem">' + (u.created_at ? new Date(u.created_at).toLocaleDateString() : '—') + '</div></div>' +
        '</div><div class="card glass"><h3 class="card-title">Quick Actions</h3><div style="display:flex;flex-wrap:wrap;gap:0.75rem">' +
        '<a href="#profile" class="btn btn-ghost btn-sm" onclick="navigate(\'profile\')">✏️ Edit Profile</a>' +
        '<a href="#apps" class="btn btn-ghost btn-sm" onclick="navigate(\'apps\')">🔑 Manage Apps</a>' +
        '<a href="#security" class="btn btn-ghost btn-sm" onclick="navigate(\'security\')">🔒 Security</a>' +
        '</div></div></div>';
    } catch (err) {
      main.innerHTML = '<div class="page active"><div class="card glass"><p style="color:var(--danger)">Failed to load dashboard: ' + escapeHtml(err.message) + '</p></div></div>';
    }
  }

  async function renderProfile() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="page active"><div class="card glass"><h2>Profile</h2><p>Update your personal information.</p><form id="profileForm">' +
      '<div class="form-row"><div class="form-group"><label>Full Name</label><input type="text" id="pf_full_name" placeholder="John Doe"></div>' +
      '<div class="form-group"><label>Display Name</label><input type="text" id="pf_display_name" placeholder="johndoe"></div></div>' +
      '<div class="form-group"><label>Avatar URL</label><input type="url" id="pf_avatar_url" placeholder="https://example.com/avatar.jpg"></div>' +
      '<div class="form-group"><label>Bio</label><textarea id="pf_bio" placeholder="Tell us about yourself" rows="3"></textarea></div>' +
      '<div class="form-row"><div class="form-group"><label>Phone Number</label><input type="tel" id="pf_phone_number" placeholder="+1 234 567 890"></div>' +
      '<div class="form-group"><label>Date of Birth</label><input type="date" id="pf_date_of_birth"></div></div>' +
      '<div class="form-row"><div class="form-group"><label>Country</label><input type="text" id="pf_country" placeholder="United States"></div>' +
      '<div class="form-group"><label>City</label><input type="text" id="pf_city" placeholder="San Francisco"></div></div>' +
      '<div class="form-group"><label>Website</label><input type="url" id="pf_website_url" placeholder="https://example.com"></div>' +
      '<div id="profileFeedback" style="margin-top:1rem"></div>' +
      '<div class="form-actions"><button type="submit" class="btn btn-success">Save Changes</button></div></form></div></div>';
    try {
      if (!state.user) { const p = await api('GET', '/api/v1/auth/profile'); state.user = p; }
      const u = state.user;
      if (u.full_name) document.getElementById('pf_full_name').value = u.full_name;
      if (u.display_name) document.getElementById('pf_display_name').value = u.display_name;
      if (u.avatar_url) document.getElementById('pf_avatar_url').value = u.avatar_url;
      if (u.bio) document.getElementById('pf_bio').value = u.bio;
      if (u.phone_number) document.getElementById('pf_phone_number').value = u.phone_number;
      if (u.date_of_birth) document.getElementById('pf_date_of_birth').value = u.date_of_birth;
      if (u.country) document.getElementById('pf_country').value = u.country;
      if (u.city) document.getElementById('pf_city').value = u.city;
      if (u.website_url) document.getElementById('pf_website_url').value = u.website_url;
    } catch (err) { /* fields stay empty */ }
    document.getElementById('profileForm').addEventListener('submit', handleProfileSave);
  }

  async function handleProfileSave(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Saving...';
    const fb = document.getElementById('profileFeedback');
    try {
      const updates = {};
      ['full_name','display_name','avatar_url','bio','phone_number','date_of_birth','country','city','website_url'].forEach(f => {
        const v = document.getElementById('pf_' + f).value.trim();
        if (v) updates[f] = v;
      });
      const data = await api('PUT', '/api/v1/auth/profile', updates);
      if (data.success) {
        state.user = data.profile;
        fb.innerHTML = '<p style="color:var(--success);font-size:0.875rem">✅ Profile updated successfully</p>';
        setTimeout(() => fb.innerHTML = '', 3000);
      } else {
        throw new Error(data.error || 'Update failed');
      }
    } catch (err) {
      fb.innerHTML = '<p style="color:var(--danger);font-size:0.875rem">❌ ' + escapeHtml(err.message) + '</p>';
    }
    btn.disabled = false; btn.textContent = 'Save Changes';
  }

  async function renderApps() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="page active"><div class="card glass"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem"><div><h2 style="margin:0">OAuth Applications</h2><p style="margin:0.25rem 0 0">Manage apps using S-Auth for authentication.</p></div><button class="btn btn-primary" onclick="showCreateApp()">+ New App</button></div></div><div id="appsList"><div class="loading"><div class="spinner"></div></div></div></div>';
    try {
      const data = await api('GET', '/api/v1/auth/developer/apps');
      state.apps = data.apps || [];
      renderAppsList();
    } catch (err) {
      document.getElementById('appsList').innerHTML = '<div class="card glass"><p style="color:var(--danger)">Failed to load apps: ' + escapeHtml(err.message) + '</p></div>';
    }
  }

  function renderAppsList() {
    const el = document.getElementById('appsList');
    if (!state.apps.length) {
      el.innerHTML = '<div class="card glass empty-state"><p>No OAuth applications yet.</p><button class="btn btn-primary btn-sm" onclick="showCreateApp()">Create your first app</button></div>';
      return;
    }
    el.innerHTML = state.apps.map(a => '<div class="app-card glass"><div class="app-info"><h4>' + escapeHtml(a.client_name) + '</h4><p><strong>Client ID:</strong> ' + escapeHtml(a.client_id) + '</p><p><strong>Redirect URIs:</strong> ' + escapeHtml((a.redirect_uris || []).join(', ')) + '</p></div><div class="app-actions"><button class="btn btn-danger btn-sm" onclick="deleteApp(\'' + a.client_id + '\')">Delete</button></div></div>').join('');
  }

  function showCreateApp() {
    showModal('<h3>Create OAuth App</h3><form id="createAppForm"><div class="form-group"><label>App Name *</label><input type="text" id="app_name" required placeholder="My App"></div><div class="form-group"><label>Description</label><textarea id="app_desc" placeholder="What does your app do?" rows="2"></textarea></div><div class="form-group"><label>Logo URL</label><input type="url" id="app_logo" placeholder="https://example.com/logo.png"></div><div class="form-group"><label>Redirect URIs * (one per line)</label><textarea id="app_uris" required placeholder="https://myapp.com/callback" rows="3"></textarea></div><div class="form-check"><input type="checkbox" id="app_confidential" checked><label for="app_confidential">Confidential client (has client secret)</label></div><div id="appFeedback" style="margin-top:0.75rem"></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create App</button></div></form>');
    document.getElementById('createAppForm').addEventListener('submit', handleCreateApp);
  }

  async function handleCreateApp(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Creating...';
    const fb = document.getElementById('appFeedback');
    try {
      const uris = document.getElementById('app_uris').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!uris.length) throw new Error('At least one redirect URI is required');
      uris.forEach(u => { if (!u.startsWith('http://') && !u.startsWith('https://')) throw new Error('Invalid URI: ' + u); });
      const data = await api('POST', '/api/v1/auth/developer/apps', {
        client_name: document.getElementById('app_name').value.trim(),
        client_description: document.getElementById('app_desc').value.trim(),
        logo_url: document.getElementById('app_logo').value.trim() || undefined,
        redirect_uris: uris,
        is_confidential: document.getElementById('app_confidential').checked
      });
      if (data.success) {
        closeModal();
        toast('App created! Save the client_secret — it won\'t be shown again.', 'success');
        state.apps.push(data.client);
        renderAppsList();
        showAppSecret(data.client.client_id, data.client.client_secret);
      } else {
        throw new Error(data.error || 'Failed to create app');
      }
    } catch (err) {
      fb.innerHTML = '<p style="color:var(--danger);font-size:0.8125rem">❌ ' + escapeHtml(err.message) + '</p>';
    }
    btn.disabled = false; btn.textContent = 'Create App';
  }

  function showAppSecret(clientId, secret) {
    showModal('<h3>🎉 App Created Successfully!</h3><div class="secret-box"><p><strong>⚠️ Save this now — it will never be shown again.</strong></p><p><strong>Client ID:</strong></p><code>' + escapeHtml(clientId) + '</code><p style="margin-top:0.75rem"><strong>Client Secret:</strong></p><code>' + escapeHtml(secret) + '</code></div><div class="form-actions"><button class="btn btn-primary" onclick="closeModal();navigate(\'apps\')">Done</button></div>');
  }

  async function deleteApp(clientId) {
    if (!confirm('Delete this OAuth application? This cannot be undone.')) return;
    try {
      const data = await api('DELETE', '/api/v1/auth/developer/apps/' + encodeURIComponent(clientId));
      if (data.success) {
        toast('App deleted', 'success');
        state.apps = state.apps.filter(a => a.client_id !== clientId);
        renderAppsList();
      } else {
        throw new Error(data.error || 'Delete failed');
      }
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  async function renderSecurity() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="page active"><div class="card glass"><h2>Security</h2><p>Your account security settings.</p></div><div class="card glass" id="securityInfo"><div class="loading"><div class="spinner"></div></div></div><div class="card glass"><h3 class="card-title">Actions</h3><button class="btn btn-danger" onclick="handleLogout()">🚪 Sign Out</button></div></div>';
    try {
      if (!state.user) { const p = await api('GET', '/api/v1/auth/profile'); state.user = p; }
      const u = state.user;
      const providers = u.oauth_providers || [];
      document.getElementById('securityInfo').innerHTML =
        '<div class="info-row"><span class="info-label">Email</span><span class="info-value">' + escapeHtml(u.email) + '</span></div>' +
        '<div class="info-row"><span class="info-label">Email Verified</span><span class="info-value">' + (u.email_verified ? '<span class="badge badge-success">Verified</span>' : '<span class="badge badge-warning">Not Verified</span>') + '</span></div>' +
        (u.email_verified_at ? '<div class="info-row"><span class="info-label">Verified At</span><span class="info-value">' + new Date(u.email_verified_at).toLocaleString() + '</span></div>' : '') +
        '<div class="info-row"><span class="info-label">Account Status</span><span class="info-value"><span class="badge badge-success">' + (u.account_status || 'active') + '</span></span></div>' +
        (u.last_signin_at ? '<div class="info-row"><span class="info-label">Last Sign In</span><span class="info-value">' + new Date(u.last_signin_at).toLocaleString() + '</span></div>' : '') +
        '<div class="info-row"><span class="info-label">Connected Providers</span><span class="info-value">' + (providers.length ? providers.map(p => '<span class="badge badge-info">' + p.provider + '</span>').join(' ') : '<span class="badge badge-warning">None</span>') + '</span></div>';
    } catch (err) {
      document.getElementById('securityInfo').innerHTML = '<p style="color:var(--danger)">Failed to load: ' + escapeHtml(err.message) + '</p>';
    }
  }

  async function handleLogout() {
    try { await api('POST', '/api/v1/auth/logout'); } catch (e) {}
    setToken(null); state.user = null; state.apps = [];
    toast('Signed out', 'success');
    navigate('login');
  }

  function renderDelete() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="page active"><div class="card glass"><h2 style="color:var(--danger)">⚠️ Danger Zone</h2><p>Permanently delete your account and all associated data.</p><div class="delete-warning"><strong>🚨 This action is irreversible!</strong><ul><li>Your profile and all data will be permanently deleted</li><li>All OAuth applications you created will be removed</li><li>You will not be able to recover your account</li></ul></div><form id="deleteForm"><div class="form-group"><label>Type <strong style="color:var(--danger)">DELETE</strong> to confirm</label><input type="text" id="deleteConfirm" placeholder="Type DELETE here" pattern="DELETE" required></div><div id="deleteFeedback"></div><div class="form-actions"><button type="submit" class="btn btn-danger" id="deleteBtn" disabled>Delete My Account</button></div></form></div></div>';
    const confirmInput = document.getElementById('deleteConfirm');
    confirmInput.addEventListener('input', function() {
      document.getElementById('deleteBtn').disabled = this.value !== 'DELETE';
    });
    document.getElementById('deleteForm').addEventListener('submit', handleDeleteAccount);
  }

  async function handleDeleteAccount(e) {
    e.preventDefault();
    if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
    const btn = document.getElementById('deleteBtn');
    btn.disabled = true; btn.textContent = 'Deleting...';
    try {
      const data = await api('DELETE', '/api/v1/auth/delete-account');
      if (data.success) {
        setToken(null); state.user = null; state.apps = [];
        toast('Account deleted', 'success');
        navigate('login');
      } else {
        throw new Error(data.error || 'Delete failed');
      }
    } catch (err) {
      document.getElementById('deleteFeedback').innerHTML = '<p style="color:var(--danger);font-size:0.875rem">❌ ' + escapeHtml(err.message) + '</p>';
      btn.disabled = false; btn.textContent = 'Delete My Account';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function init() {
    const hash = location.hash.replace('#', '') || '';
    if (getToken()) {
      if (!hash || hash === 'login') navigate('dashboard');
      else navigate(hash);
    } else {
      navigate('login');
    }
  }

  window.addEventListener('hashchange', () => {
    const hash = location.hash.replace('#', '') || 'dashboard';
    renderView(hash);
  });

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
